<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login - pbsNet</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <script src="config.js"></script>
    <style>
        body { 
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            background: #0f172a; 
            color: #f1f5f9; 
        }
        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #1e293b;
            border-bottom-color: #3b82f6;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { margin-top: 24px; font-size: 18px; font-weight: 600; color: #ffffff; }
        p { color: #94a3b8; font-size: 14px; margin-top: 8px; }
    </style>
</head>
<body>
    <span class="loader"></span>
    <h2>Connecting to Google</h2>
    <p>Please wait while we redirect you...</p>

    <script>
        window.onload = function() {
            setTimeout(() => {
                try {
                    // Force HTTPS for redirect URL
                    let currentOrigin = window.location.origin;
                    if (currentOrigin.startsWith('http:')) {
                        currentOrigin = currentOrigin.replace('http:', 'https:');
                    }
                    account.createOAuth2Session('google', currentOrigin, currentOrigin);
                } catch(err) {
                    console.error("Auth Error:", err);
                    alert("Authentication failed. Please try again.");
                    window.location.href = '/';
                }
            }, 800);
        };
    </script>
</body>
</html>
